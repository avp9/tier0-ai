# Isolated stack for browser tests: the real app and Postgres with fake language models and a
# fake ticket system. The credentials below are throwaway values for this local stack only.
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: tier0
      POSTGRES_PASSWORD: tier0-e2e-only
      POSTGRES_DB: tier0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tier0 -d tier0"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: e2e
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: e2e
      LOG_FORMAT: json
      LLM_PROVIDER: fake
      TICKETING_PROVIDER: fake
      E2E_TOKEN: ${E2E_TOKEN:-e2e-local-token}
      DATABASE_URL: postgresql://tier0:tier0-e2e-only@db:5432/tier0
      SESSION_SECRET: e2e-only-session-secret-not-for-real-use-0123456789
      DEMO_USERS: >-
        [{"email":"alice@buzztech.example","name":"Alice Demo","password":"alice-demo-pass-1","gender":"female"},
         {"email":"bob@buzztech.example","name":"Bob Demo","password":"bob-demo-pass-22","gender":"male"}]
