[project]
name = "tier0"
version = "0.1.0"
description = "Tier0 AI: intelligent IT & HR operations agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "fastembed>=0.9",
    "itsdangerous>=2.2.0",
    "jira>=3.10.5",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.17",
    "openai>=3.46.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "redisvl>=0.31",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tier0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "tests"
files = ["src", "tests"]

# RedisVL ships without type information.
[[tool.mypy.overrides]]
module = ["redisvl", "redisvl.*"]
ignore_missing_imports = true
