[project]
name = "tier0"
version = "0.1.0"
description = "Tier0 AI: intelligent IT & HR operations agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "jira>=3.10.5",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tier0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
