name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Throwaway database for the integration tests; it exists only for this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tier0
          POSTGRES_PASSWORD: tier0-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tier0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # For the semantic cache tests (Redis 8 includes the search module they need).
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TIER0_TEST_DATABASE_URL: postgresql://tier0:tier0-ci-only@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
      TIER0_TEST_REDIS_URL: redis://localhost:6379
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check . ../deploy
      - name: Lint
        run: uv run ruff check . ../deploy
      - name: Type check
        run: uv run mypy
      - name: Unit and integration tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      # Anything that ships to browsers must be clean at every severity. Dev tools only fail the
      # build at high severity: the one known finding is a moderate denial-of-service in a lint
      # tool that only ever reads this repository's own files.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit development tools
        run: npm audit --audit-level=high

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack (fake language models and ticket system)
        run: docker compose up -d --build --wait
        env:
          E2E_TOKEN: ${{ github.run_id }}-e2e-only
      - name: Install test dependencies and browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: e2e
        run: npm test
        env:
          E2E_TOKEN: ${{ github.run_id }}-e2e-only
      - name: Type check the tests
        working-directory: e2e
        run: npm run typecheck
      - name: Show app logs if something failed
        if: failure()
        run: docker compose logs app --tail 200
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      # A small index stands in for the real one (which needs an API key and is built at deploy).
      - name: Build a fixture index to supply to the image
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python scripts/build_index.py --embedder fake --kb-dir ../data/fixtures --index-dir "$RUNNER_TEMP/index"
      - name: Build the production image
        run: docker build --target prod --build-context index="$RUNNER_TEMP/index" --build-arg INDEX_HASH=ci-fixture -t tier0:ci .
      # Run after a successful build on purpose: cached layers must not let this one through.
      - name: Refuses to build without an index
        run: |
          if docker build --target prod -t tier0:noindex . ; then
            echo "a build without an index must fail"; exit 1
          fi
          if docker build --target prod --build-arg INDEX_HASH=x -t tier0:noindex . ; then
            echo "a build without an index context must fail"; exit 1
          fi
      - name: Runs as a non-root user
        run: test "$(docker run --rm tier0:ci id -u)" != 0
      - name: Exits instead of serving when its dependencies are unreachable
        run: |
          if docker run --rm -e APP_ENV=production -e DATABASE_URL=postgresql://x@h/d \
               -e SESSION_SECRET=0123456789012345678901234567890123456789 tier0:ci; then
            echo "expected a startup failure"; exit 1
          fi
      - name: Report image size
        run: |
          size=$(docker image ls tier0:ci --format '{{.Size}}')
          printf '### Image size\n%s\n' "$size" >> "$GITHUB_STEP_SUMMARY"

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Lint and compile
        run: |
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Parameters compile
        run: |
          for v in POSTGRES_ADMIN_PASSWORD STAGING_SESSION_SECRET PRODUCTION_SESSION_SECRET \
                   OPENAI_API_KEY TYPESAFE_API_KEY JIRA_API_TOKEN STAGING_DEMO_USERS \
                   PRODUCTION_DEMO_USERS JIRA_SERVER JIRA_USERNAME; do export "$v=placeholder"; done
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
      - name: Setup script is valid shell
        run: bash -n infra/bootstrap-azure.sh
      - name: Lint the workflows
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked
      # The four chromadb advisories below affect only Chroma's HTTP server (REST endpoints and its
      # RBAC provider). Tier0 uses the embedded in-process client and never runs that server; a test
      # (test_chroma_server_unused) enforces this. No fixed version exists yet. See ADR 0002.
      # Any other or new advisory, including a new chromadb one, still fails this job.
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
