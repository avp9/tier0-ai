name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Throwaway database for the integration tests; it exists only for this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tier0
          POSTGRES_PASSWORD: tier0-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tier0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TIER0_TEST_DATABASE_URL: postgresql://tier0:tier0-ci-only@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Unit and integration tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      # Anything that ships to browsers must be clean at every severity. Dev tools only fail the
      # build at high severity: the one known finding is a moderate denial-of-service in a lint
      # tool that only ever reads this repository's own files.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit development tools
        run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      # The four chromadb advisories below affect only Chroma's HTTP server (REST endpoints and its
      # RBAC provider). Tier0 uses the embedded in-process client and never runs that server; a test
      # (test_chroma_server_unused) enforces this. No fixed version exists yet. See ADR 0002.
      # Any other or new advisory, including a new chromadb one, still fails this job.
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
