name: Infrastructure

# Applies infra/main.bicep. Manual only, and the `production` environment needs the owner's
# approval first. This is how GitHub secrets become Container Apps secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      STAGING_SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
      PRODUCTION_SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      STAGING_DEMO_USERS: ${{ secrets.STAGING_DEMO_USERS }}
      PRODUCTION_DEMO_USERS: ${{ secrets.PRODUCTION_DEMO_USERS }}
      JIRA_SERVER: ${{ secrets.JIRA_SERVER }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Keep the images currently running
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          for pair in staging:STAGING_IMAGE prod:PRODUCTION_IMAGE; do
            image=$(az containerapp show -n "ca-tier0-${pair%%:*}" -g "$rg" \
              --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
            [ -n "$image" ] && echo "${pair##*:}=$image" >> "$GITHUB_ENV"
          done
          exit 0
      - name: Preview the changes
        run: |
          az deployment group what-if -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --parameters infra/main.bicepparam
      - name: Deploy
        run: |
          az deployment group create -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --parameters infra/main.bicepparam -o none
